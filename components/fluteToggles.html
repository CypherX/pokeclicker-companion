<!-- Flute switches for the damage calculation tools. Data: { settings: { activeFlutes, allFlutesToggle }, idPrefix } -->
<script type="text/html" id="flute-toggles-template">
    <div class="row justify-content-center mt-1">
        <!-- ko foreach: Object.values(GameConstants.FluteItemType) -->
        <div class="col-auto" data-bind="tooltip: {
            html: true,
            title: `${ItemList[$data].description}<br />${ItemList[$data].gemTypes.join(', ')}`,
            placement: 'bottom',
            trigger: 'hover',
        }">
            <div class="form-check form-check-inline form-switch me-3">
                <input class="form-check-input" type="checkbox" role="switch" data-bind="checkedValue: $data, checked: $parent.settings.activeFlutes,
                    attr: { id: `${$parent.idPrefix}_${$data}` }">
                <label class="form-check-label" data-bind="text: GameConstants.humanifyString($data), attr: { for: `${$parent.idPrefix}_${$data}` }"></label>
            </div>
        </div>
        <!-- /ko -->
        <div class="col-auto">
            <div class="form-check form-check-inline form-switch me-3">
                <input class="form-check-input" type="checkbox" role="switch" data-bind="checked: settings.allFlutesToggle, attr: { id: `${idPrefix}_AllFlutes` }">
                <label class="form-check-label" data-bind="attr: { for: `${idPrefix}_AllFlutes` }">All</label>
            </div>
        </div>
    </div>
    <div class="text-muted small text-center mt-1">Active flutes provide a +0.5% typed damage bonus for the Gem types they consume.</div>
    <hr class="my-1" />
    <div class="text-muted small text-center">Damage calculations include all Pokémon in your party at the current max level. Being in the hatchery or not max level will not affect these calculations.</div>
</script>
